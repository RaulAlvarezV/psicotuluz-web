<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · Psicotuluz</title>
<meta name="robots" content="noindex">
<style>
  :root{--crema:#FFF8F0;--lila:#b28ee1;--lila-soft:#efe6fb;--azul:#2C4A70;--tinta:#5e5c5c;--amarillo:#F2C20A}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,var(--crema),var(--lila-soft));font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--tinta);padding:24px;text-align:center}
  .card{max-width:520px}
  .big{font-size:96px;font-weight:800;color:var(--lila);line-height:1}
  h1{font-size:26px;color:var(--azul);margin:12px 0 10px}
  p{font-size:16px;line-height:1.6;margin-bottom:26px}
  a.btn{display:inline-block;background:var(--amarillo);color:#3a2e00;text-decoration:none;font-weight:700;padding:14px 28px;border-radius:30px;box-shadow:0 10px 30px rgba(242,194,10,.35)}
</style>
</head>
<body>
  <div class="card">
    <div class="big">404</div>
    <h1>No encontramos esta página</h1>
    <p>Puede que el enlace esté roto o que la página ya no exista. Volvé al inicio para seguir conociendo Psicotuluz.</p>
    <a class="btn" href="/">Volver al inicio</a>
  </div>
</body>
</html>
